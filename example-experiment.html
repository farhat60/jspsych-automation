<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsPsych HTML Button Response Example</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body></body>
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <script src="packages/plugin-html-button-response/dist/index.browser.min.js"></script>
  <script>
    // Initialize jsPsych
    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    // Create timeline
    const timeline = [];

    // Trial 1: Welcome screen
    timeline.push({
      type: HtmlButtonResponsePlugin,
      stimulus: "<h1>Welcome to the Experiment</h1>",
      choices: ["Continue"],
      response_ends_trial: true,
    });

    // Trial 2: Example question
    timeline.push({
      type: HtmlButtonResponsePlugin,
      stimulus: "<h2>What is your favorite color?</h2>",
      choices: ["Red", "Blue", "Green", "Yellow"],
      prompt: "<p>Please choose one option</p>",
      button_layout: "grid",
      grid_columns: 2,
      response_ends_trial: true,
    });

    // Trial 3: Another question
    timeline.push({
      type: HtmlButtonResponsePlugin,
      stimulus: "<h2>Is this fun?</h2>",
      choices: ["Yes", "No"],
      button_layout: "flex",
      response_ends_trial: true,
    });

    // Trial 4: Thank you screen
    timeline.push({
      type: HtmlButtonResponsePlugin,
      stimulus: "<h1>Thank you for participating!</h1>",
      choices: ["Finish"],
      response_ends_trial: true,
    });

    // Run the experiment
    jsPsych.run(timeline);
  </script>
</html>
